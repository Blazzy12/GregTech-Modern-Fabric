plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.mod_id }

repositories {
    mavenCentral()
    maven { name = 'Toma'; url = 'https://repo.repsy.io/mvn/toma/public' }
    maven { name = 'SquidDev'; url = 'https://maven.squiddev.cc' }
    maven { name = "Jared's Maven"; url = 'https://maven.blamejared.com/' }
    exclusiveContent {
        // cloth basic-math (me.shedaniel.math), which REI's API uses; Cloth Config nests it in its jar
        forRepository { maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' } }
        filter { includeModule('me.shedaniel.cloth', 'basic-math') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven/' } }
        filter { includeGroup('maven.modrinth') }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/gtceu.classtweaker')
    mixin { useLegacyMixinAp = false }
    runs {
        // headless server that loads data, makes a test world, runs the game tests and exits
        gametest {
            inherit server
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            // XaeroLib freezes its config registry on dedicated server start, which the game test server skips
            vmArg '-Dfabric.debug.disableModIds=xaerominimap,xaeroworldmap,xaerolib'
            runDir 'build/gametest'
        }
    }
}

sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
    }
}

// scripted client tests (./gradlew runClientGameTest): play through GT in a test world and take screenshots
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'gtceu-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// The JourneyMap API and XaeroLib are only published nested inside their mods' jars (META-INF/jars), so they are
// extracted from those jars into libs/ before compiling. libs/ is not checked in.
configurations {
    nestedLibSources { transitive = false }
}

def extractLibs = tasks.register('extractLibs', Copy) {
    from({ configurations.nestedLibSources.collect { zipTree(it) } }) {
        include 'META-INF/jars/journeymap-api-fabric-*.jar', 'META-INF/jars/xaerolib-fabric-*.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into 'libs'
}

dependencies {
    nestedLibSources "maven.modrinth:journeymap:${project.journeymap_version}"
    nestedLibSources "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "dev.toma.configuration:configuration-fabric:${project.configuration_version}"
    include "dev.toma.configuration:configuration-fabric:${project.configuration_version}"

    implementation "com.ezylang:EvalEx:${project.evalex_version}"
    include "com.ezylang:EvalEx:${project.evalex_version}"

    // integrations (optional at runtime; each is only touched when its mod is loaded)
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
    // ./gradlew runClient -PwithRei=true runs with REI instead of JEI
    if (project.findProperty('withRei') == 'true') {
        localRuntime "maven.modrinth:rei:${project.rei_version}"
        localRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
        localRuntime "maven.modrinth:architectury-api:${project.architectury_version}"
    } else {
        localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
    }
    compileOnly "maven.modrinth:rei:${project.rei_version}"
    compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    compileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric-api:${project.cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric:${project.cc_version}"
    localRuntime "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric:${project.cc_version}"
    compileOnly "maven.modrinth:journeymap:${project.journeymap_version}"
    compileOnly files("libs/journeymap-api-fabric-26.3-2.0.0.jar").builtBy(extractLibs)
    compileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    compileOnly "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
    compileOnly files("libs/xaerolib-fabric-26.3-1.8.5.jar").builtBy(extractLibs)
    localRuntime "maven.modrinth:journeymap:${project.journeymap_version}"
    localRuntime "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    localRuntime "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
    compileOnly "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "maven.modrinth:jade:${project.jade_version}"
    localRuntime "maven.modrinth:jade:${project.jade_version}"

    // ./gradlew runClient -PwithSodium=true runs with Sodium and Iris
    if (project.findProperty('withSodium') == 'true') {
        localRuntime "maven.modrinth:sodium:${project.sodium_version}"
        localRuntime "maven.modrinth:iris:${project.iris_version}"
    }

    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "javax.annotation:javax.annotation-api:1.3.2"
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") { expand "version": version }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0', '-proc:full', '-XDshould-stop.ifError=FLOW']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast { cp.files.each { println it } }
}

tasks.register('printJavacArgs') {
    def t = tasks.named('compileJava')
    doLast {
        println t.get().options.allCompilerArgs
        println t.get().options.annotationProcessorPath?.files
    }
}

// ./gradlew runClientGameTest -PprodLike=true makes GT and ModularUI behave as in production
// (high-tier content off, no dev-only items or debug overlays)
if (project.findProperty('prodLike') == 'true') {
    tasks.matching { it.name.startsWith('run') }.configureEach { jvmArgs '-Dgtceu.prodLike=true' }
}
